[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valence-assent-axis"
version = "1.0.0"
description = "Reproduction code for the Valence-Assent Axis experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Yi-Long Lu"},
  {name = "Jiajun Song"},
  {name = "Wei Wang"},
]
dependencies = [
  "accelerate>=0.26",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.1",
  "transformers>=4.45",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.8",
  "nbformat>=5.9",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "seaborn>=0.13",
  "statsmodels>=0.14",
]
test = [
  "pytest>=8.0",
  "tomli>=2.0; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
