schema_version: 1
main_figures:
  figure1:
    manuscript_image: figures/figure1.jpg
    build_scope: conceptual figure; no numerical source data
  figure2:
    script: analysis/figures/figure2.py
    notebook: notebooks/main_figures/figure2.ipynb
    manuscript_pdf: figures/main/figure2.pdf
    build_scope: complete_quantitative_figure
