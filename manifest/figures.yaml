    script: analysis/figures/figure3.py
    notebook: notebooks/main_figures/figure3.ipynb
    manuscript_pdf: figures/main/figure3.pdf
    build_scope: complete_quantitative_figure
  figure4:
    script: analysis/figures/figure4.py
    notebook: notebooks/main_figures/figure4.ipynb
