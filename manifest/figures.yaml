    editable_composite: figures/source/figure4_complete.tex
    composite_base: figures/source/figure4_base.pdf
    build_scope: quantitative_panels; final examples arranged in vector editor
  figure5:
    script: analysis/figures/figure5.py
    notebook: notebooks/main_figures/figure5.ipynb
    manuscript_pdf: figures/main/figure5.pdf
    editable_composite: figures/main/figure5_editable.drawio.pdf
    build_scope: quantitative_panels; final example and task schematic arranged in draw.io
  figure6:
    script: analysis/figures/figure6.py
    notebook: notebooks/main_figures/figure6.ipynb
    manuscript_pdf: figures/main/figure6.pdf
